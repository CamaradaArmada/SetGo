# Runs the tests (tests/run.sh) at every push to main and on pull requests,
# so a release tag is only pushed once they pass.
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the Lua build of the tests links readline
      - name: Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreadline-dev
          bash tests/run.sh
